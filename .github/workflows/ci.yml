name: Python CI

on:
  push:
    branches:
      - demo

  pull_request:
    branches:
      - demo

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install ruff

      - run: ruff check .
  
  python-syntax-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check app.py syntax
        run: |
          python -m py_compile app.py

  yaml-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate databricks.yml
        run: yamllint .github/workflows/databricks.yml