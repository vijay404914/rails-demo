name: Databricks - Testable Workflow

# This workflow adds a safe manual test path and an optional Databricks run.
# - Use the workflow_dispatch input `run_databricks: true` to actually invoke the Databricks action.
# - The Databricks job will only run if you set the required secrets (DATABRICKS_HOST and DATABRICKS_TOKEN) and pass the input.
# This keeps the workflow safe for testing without contacting Databricks accidentally.

on:
  workflow_dispatch:
    inputs:
      run_databricks:
        description: 'Set to "true" to run the Databricks action. Default: false.'
        required: false
        default: 'false'

jobs:
  test:
    name: Quick YAML / repo sanity test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print workflow file path
        run: |
          echo "Testing .github/workflows/databricks.yml"
          ls -la .github/workflows || true

      - name: Show a short notice
        run: echo "This is a safe test job. Set the workflow input 'run_databricks' to 'true' to run the Databricks action (requires secrets)."

  run-databricks:
    name: Run Databricks Notebook (manual)
    needs: test
    if: ${{ github.event.inputs.run_databricks == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Databricks Notebook
        uses: databricks/run-notebook@v0.0.3
        with:
          # Provide either local-notebook-path OR workspace-notebook-path.
          # For testing, prefer workspace-notebook-path and set the DATABRICKS secrets in repo settings.
          workspace-notebook-path: "/Users/test@example.com/My Notebook"
          databricks-host: ${{ secrets.DATABRICKS_HOST }}
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
          run-name: "Test run from GitHub Actions"

      - name: Notify
        if: always()
        run: echo "Databricks job triggered (or attempted). Check logs for results."
